name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - refactor/multi-version
  workflow_dispatch:

jobs:
  tests:
    name: "Tests PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check opt-in codecs without optional extensions
        run: php -n tests/Support/check-runtime.php

      - name: Run tests
        run: composer test

  code-quality:
    name: "Code quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style (Mago format)
        if: ${{ !cancelled() }}
        run: vendor/bin/mago format --check

      - name: Lint (Mago)
        if: ${{ !cancelled() }}
        run: vendor/bin/mago lint --reporting-format=github --minimum-report-level=warning

      - name: Static analysis (Mago)
        if: ${{ !cancelled() }}
        run: vendor/bin/mago analyze --reporting-format=github --minimum-report-level=warning
